name: Build and publish Bedrock add-on

on:
  push:
    branches: [co-op-adventure-bedrock]
    paths:
      - "CoopAdventure/**"
      - ".github/workflows/build-addon.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon generator dependency
        run: python -m pip install --upgrade pip pillow
      - name: Build the mcaddon
        run: python CoopAdventure/build_pack.py
      - name: Keep a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coop-Adventure-Bedrock-1.19
          path: CoopAdventure/Coop_Adventure_Bedrock_1.19.mcaddon
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create co-op-adventure-v1.0.0 \
            CoopAdventure/Coop_Adventure_Bedrock_1.19.mcaddon \
            --repo "$GITHUB_REPOSITORY" \
            --title "Co-op Adventure for Bedrock 1.19" \
            --notes-file CoopAdventure/README.md \
            --target co-op-adventure-bedrock
