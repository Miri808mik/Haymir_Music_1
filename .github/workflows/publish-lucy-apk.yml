name: Publish Lucy Android APK

on:
  workflow_dispatch:
  schedule:
    # Check once per day; avoids repeatedly waking the free Render service.
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: lucy-apk-publication
  cancel-in-progress: false

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public downloads repository
        uses: actions/checkout@v4

      - name: Download latest APK from Render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 10 \
            --connect-timeout 20 --max-time 600 \
            "https://lucy-apk-builder-1260.onrender.com/download/latest.apk" \
            --output dist/Lucy-latest.apk
          test -s dist/Lucy-latest.apk
          size="$(stat -c '%s' dist/Lucy-latest.apk)"
          echo "Downloaded APK size: $size bytes"
          # Prevent publishing HTML/error pages or the known broken tiny APK builds.
          test "$size" -ge 5000000
          unzip -t dist/Lucy-latest.apk >/dev/null
          unzip -l dist/Lucy-latest.apk | grep -q 'AndroidManifest.xml'
          sha256sum dist/Lucy-latest.apk | tee dist/SHA256SUMS

      - name: Read Android package version
        uses: android-actions/setup-android@v3

      - name: Validate package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging dist/Lucy-latest.apk)"
          echo "$BADGING" | grep -q "^package:"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Validated Lucy Android $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Skip publication when the APK is unchanged
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download latest --repo "$GITHUB_REPOSITORY" --pattern Lucy-latest.apk --dir /tmp/lucy-current >/dev/null 2>&1; then
            if cmp -s dist/Lucy-latest.apk /tmp/lucy-current/Lucy-latest.apk; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Current public APK is already identical."
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish stable download release
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Lucy Android latest" \
              --notes "Automatically published validated APK. Version: $VERSION_NAME (versionCode $VERSION_CODE)."
          fi
          gh release upload latest dist/Lucy-latest.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit latest --repo "$GITHUB_REPOSITORY" \
            --title "Lucy Android $VERSION_NAME (latest)" \
            --notes "Validated Android APK. Version: $VERSION_NAME (versionCode $VERSION_CODE). SHA-256 is provided in SHA256SUMS." \
            --latest

      - name: Write publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lucy APK publication"
            echo "- Source: Render APK builder"
            echo "- Public repository: $GITHUB_REPOSITORY"
            echo "- Stable download: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/Lucy-latest.apk"
            echo "- Previous release asset is replaced only after validation succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
